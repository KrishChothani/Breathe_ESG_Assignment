name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Docker Buildx ─────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Docker Hub login ──────────────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── 4. Build & push image ────────────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/breatheesg-backend:latest

      # ── 5. AWS credentials ───────────────────────────────────────────────────
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.MY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MY_AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.MY_AWS_REGION }}

      # ── 6. Resolve EC2 public IP from instance ID ────────────────────────────
      - name: Get EC2 Public IP
        id: get-ip
        run: |
          EC2_IP=$(aws ec2 describe-instances \
            --instance-ids i-0f007aabc48ef43f0 \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "ec2_ip=$EC2_IP" >> $GITHUB_OUTPUT

      # ── 7. SSH into EC2 → pull & restart container ───────────────────────────
      - name: Deploy and restart Docker container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:         ${{ steps.get-ip.outputs.ec2_ip }}
          username:     ubuntu
          key:          ${{ secrets.EC2_SSH_KEY }}
          script_stop:  false   # don't abort on "no such container" errors
          script: |
            # ── Install Docker if not present (idempotent) ──────────────────
            if ! command -v docker &> /dev/null; then
              echo "Docker not found — installing..."
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg lsb-release
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io
              sudo systemctl enable docker
              sudo systemctl start docker
              echo "Docker installed: $(docker --version)"
            else
              echo "Docker already installed: $(docker --version)"
            fi

            # ── Ensure env file directory exists ─────────────────────────────
            mkdir -p /home/ubuntu/breatheesg

            # ── Deploy ────────────────────────────────────────────────────────
            sudo docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            sudo docker stop breatheesg-backend || true
            sudo docker rm   breatheesg-backend || true
            sudo docker image prune -af
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/breatheesg-backend:latest
            sudo docker run -d \
              --name breatheesg-backend \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file /home/ubuntu/breatheesg/.env \
              -e GUNICORN_WORKERS=3 \
              -e GUNICORN_THREADS=2 \
              ${{ secrets.DOCKER_USERNAME }}/breatheesg-backend:latest

